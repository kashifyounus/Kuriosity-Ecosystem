name: KE Repository Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate KE authority and metadata
        run: python tools/validate_repository.py
      - name: Validate autonomous engineering state
        run: python tools/ke_harness.py validate
      - name: Test autonomous engineering harness
        run: python -m unittest discover -s tests -p "test_*.py"
